name: daily-update

on:
  schedule:
    - cron: "0 0 * * *"        # 每天 UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}        # 手动触发（Settings→Actions→Run workflow）

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/ 随仓库持久化：每次在“上次的数据”上做增量抓取
      - name: Run pipeline (fetch -> summarize -> build site)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 src/pipeline.py || echo "pipeline exit != 0 (网络或数据问题)，沿用仓库内旧数据"
          python3 src/build_site.py || echo "build failed"

      - name: Commit data updates back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: daily data update $(date -u +%F)"
            git push
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "deploy $(date -u +%F)"
